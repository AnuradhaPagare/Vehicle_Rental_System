<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vehicle Rental Payment</title>
</head>
<body>
  <!-- <h2>Complete Your Payment</h2> -->
  <button id="rzp-button">Pay Now</button>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    // 1. Example user info stored in localStorage after login
    // You should save this during your login process
    // Example:
    // localStorage.setItem("user", JSON.stringify({
    //   name: "Anuradha",
    //   email: "anuradha@example.com",
    //   contact: "9876543210"
    // }));

    const user = JSON.parse(localStorage.getItem('user')) || {
      name: "Guest User",
      email: "guest@example.com",
      contact: "9999999999"
    };

    document.getElementById('rzp-button').onclick = async function () {
      try {
        const response = await fetch("http://localhost:5000/order", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Basic " + btoa("rzp_test_7SNgBJk5mfT1c9:JPjnoGuqaG38qrIUXNjZqsFk")
          },
          body: JSON.stringify({ amount: 50000 }) // Amount in paise = ₹500.00
        });

        const order = await response.json();

        const options = {
          "key": "rzp_test_7SNgBJk5mfT1c9", // Replace with your Razorpay test/live key
          "amount": order.amount,
          "currency": order.currency,
          "name": "Vehicle Rental",
          "description": "Rental Booking Payment",
          "image": "https://yourdomain.com/logo.png",
          "order_id": order.id,
          "handler": function (response) {
            alert("Payment successful!");
            alert("Payment ID: " + response.razorpay_payment_id);
            // Here, you can send payment ID to backend for verification/storage
          },
          "prefill": {
            "name": user.name,
            "email": user.email,
            "contact": user.contact
          },
          "theme": {
            "color": "#0f9d58"
          }
        };

        const rzp = new Razorpay(options);
        rzp.open();
      } catch (err) {
        console.error("Error during payment:", err);
        alert("Something went wrong. Please try again.");
      }
    };
  </script>
</body>
</html>
